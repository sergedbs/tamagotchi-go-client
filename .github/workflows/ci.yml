name: checks

on:
  pull_request:
  push:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: python3 tools/check_spec.py
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
      # Fixture browser tests only; real-target tests never run in CI.
      - run: npm run test:e2e
